<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskPilot | AI IT Support Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Shows any crash on screen instead of a blank page
      window.addEventListener('error', function (e) {
        document.body.insertAdjacentHTML('afterbegin', '<pre style="color:#f55;background:#222;padding:1rem;white-space:pre-wrap">Error: ' + e.message + ' (' + (e.filename||'') + ':' + e.lineno + ')</pre>');
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
